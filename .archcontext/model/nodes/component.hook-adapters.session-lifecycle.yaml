schemaVersion: archcontext.node/v2
id: component.hook-adapters.session-lifecycle
kind: component
name: Session Lifecycle Handlers
status: active
parent: capability.runtime-harness.hook-adapters
layer: cli
summary: "Typed handlers for session context, the architecture notice point, Stop recovery and subagent routes."
responsibilities:
  - Build SessionStart sections from Effective State and the session providers.
  - Publish the evidence checkpoint and render handoff and resume at Stop, including the _ops and _ref manifest notice.
  - Keep host rendering separate and preserve the installed UserPromptSubmit inbox tuple.
  - Record native subagent starts and stamp the return-channel contract and standing orders onto subagent prompts.
  - "Collect the architecture notice through the notice port at SessionStart, Claude Stop and Codex or Pi UserPromptSubmit."
source:
  include:
    - src/cli/hook/protected-path-notice.ts
    - src/cli/hook/return-channel.ts
    - src/cli/hook/session-context.ts
    - src/cli/hook/standing-orders-context.ts
    - src/cli/hook/state-snapshot.ts
    - src/cli/hook/stop-handler.ts
    - src/cli/hook/subagent-context.ts
  entrypoints:
    - id: entrypoint.hook-adapters.stop
      path: src/cli/hook/stop-handler.ts
      symbols:
        - name: runStopHandler
          sinks:
            - id: sink.hook-adapters.evidence-checkpoint
              path: src/effects/evidence/checkpoint-store.ts
              symbol: publishCheckpointFromLedger
    - id: entrypoint.hook-adapters.session-context
      path: src/cli/hook/session-context.ts
      symbols:
        - name: buildSessionStartSections
          sinks:
            - id: sink.hook-adapters.session-state-section
              path: src/cli/hook/session-context.ts
              symbol: projectEffectiveStateSessionSection
    - id: entrypoint.hook-adapters.return-channel
      path: src/cli/hook/return-channel.ts
      symbols:
        - name: runReturnChannel
          sinks:
            - id: sink.hook-adapters.return-channel-standing-orders
              path: src/cli/hook/standing-orders-context.ts
              symbol: appendStandingOrders
    - id: entrypoint.hook-adapters.subagent-context
      path: src/cli/hook/subagent-context.ts
      symbols:
        - name: runSubagentContext
          sinks:
            - id: sink.hook-adapters.subagent-standing-orders
              path: src/cli/hook/standing-orders-context.ts
              symbol: appendStandingOrders
