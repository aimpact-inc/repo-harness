schemaVersion: archcontext.node/v2
id: capability.public-surface.adoption
kind: capability
name: Adoption
status: active
layer: core
summary: Plans and applies repository adoption through the canonical filesystem transaction boundary.
responsibilities:
  - Own adoption planning, transaction apply, and rollback behavior.
source:
  include:
    - src/core/adoption/**
    - src/effects/adoption/**
    - src/effects/fs-transaction.ts
    - src/cli/commands/adoption-plan.ts
    - src/cli/repo-adoption/**
  entrypoints:
    - id: entrypoint.adoption.primary
      path: "src/cli/commands/adoption-plan.ts"
      symbols:
        - name: "runAdoptionApply"
          sinks:
            - id: sink.adoption.primary
              path: "src/effects/fs-transaction.ts"
              symbol: "applyAdoptionPlan"
extensions:
  harnessTier: "core"
  contractFiles:
    agents: "AGENTS.md"
    claude: "CLAUDE.md"
  lspProfile: "typescript-lsp"
  verification:
    - "bun test tests/cli/adoption-plan.test.ts"
    - "bun run check:type"
