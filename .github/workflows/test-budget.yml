name: Test budget

# ADR-0004: the producer of the TestBudget result. The rule is telemetry: it
# reports on the PR and never fails (#3181). Its own group keeps a run from
# cancelling the CI workflow.
on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read

concurrency:
  group: test-budget-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  test-budget:
    name: Test budget
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      # The policy comes from the base commit; the result document is the notice annotation and the job summary is its human view.
      - name: Report the test budget
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: bun src/cli/index.ts rules check TestBudget --base "$BASE_SHA" --head "$HEAD_SHA" --github-annotation --github-summary "$GITHUB_STEP_SUMMARY"
